server {
	server_name	$WORDPRESS_DOMAIN;
	listen		${NGINX_PORT} ssl default_server;
	http2		on;

	include	security_headers.conf;

	ssl_protocols		TLSv1.2 TLSv1.3;
	ssl_certificate		/etc/nginx/ssl/inception.crt;
	ssl_certificate_key	/etc/nginx/ssl/inception.key;

	root	/home/web-drive;
	index	index.php index.html;

	client_max_body_size	64m;

	location / {
		try_files $uri $uri/ /index.php?$args;
	}
	# block dotfiles (must precede the \.php$ regex: first match wins)
	location ~ /\. {
		deny	all;
	}
	location ~ \.php$ {
		include			fastcgi_params;
		fastcgi_pass	wordpress:${WORDPRESS_FPM_PORT};
		fastcgi_index	index.php;
		fastcgi_param	SCRIPT_FILENAME	$document_root$fastcgi_script_name;
		fastcgi_param	SCRIPT_NAME		$fastcgi_script_name;
		fastcgi_param	HTTPS			$https;
	}
	# never serve wp-config.php (contains db credentials)
	location = /wp-config.php {
		deny	all;
	}
}
