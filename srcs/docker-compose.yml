name: Inception
# ==============================================================================
services:
  mariadb:
    build:
      context: ./requirements/mariadb/.
    restart: always
    volumes:
      - database:/home/database:rw
    environment:
      - WORDPRESS_DB_NAME=${WORDPRESS_DB_NAME:-wordpress}
      - WORDPRESS_DB_USER=${WORDPRESS_DB_USER:-wordpress}
      - DB_CHARSET=${DB_CHARSET:-utf8mb4}
      - DB_COLLATE=${DB_COLLATE:-utf8mb4_uca1400_ai_ci}
      - MARIADB_PORT=${MARIADB_PORT:-3306}
      - MARIADB_ROOT_PASSWORD_FILE=/run/secrets/mariadb_root_password
      - MARIADB_USER_PASSWORD_FILE=/run/secrets/mariadb_user_password
    secrets:
      - mariadb_root_password
      - mariadb_user_password
    networks:
      - backend
# -----
  wordpress:
    build: ./requirements/wordpress/.
    depends_on:
      mariadb:
        condition: service_healthy
        # restart: true
    restart: always
    volumes:
      - website:/home/website:rw
    environment:
      - WORDPRESS_DB_NAME=${WORDPRESS_DB_NAME:-wordpress}
      - WORDPRESS_DB_USER=${WORDPRESS_DB_USER:-wordpress}
      - WORDPRESS_DB_TABLE_PREFIX=${WORDPRESS_DB_TABLE_PREFIX:-wordpress_}
      - DB_CHARSET=${DB_CHARSET:-utf8mb4}
      - DB_COLLATE=${DB_COLLATE:-utf8mb4_uca1400_ai_ci}
      - WORDPRESS_DOMAIN=${WORDPRESS_DOMAIN:-vpoka.42.fr}
      - WORDPRESS_TITLE=${WORDPRESS_TITLE:-Inception}
      - WORDPRESS_ADMIN_NAME=${WORDPRESS_ADMIN_NAME:-owner}
      - WORDPRESS_ADMIN_EMAIL=${WORDPRESS_ADMIN_EMAIL:-admin@invalid.email}
      - WORDPRESS_USER_NAME=${WORDPRESS_USER_NAME:-user}
      - WORDPRESS_USER_EMAIL=${WORDPRESS_USER_EMAIL:-user@invalid.email}
      - NGINX_PORT=${NGINX_PORT:-443}
      - WORDPRESS_FPM_PORT=${WORDPRESS_FPM_PORT:-9000}
      - MARIADB_PORT=${MARIADB_PORT:-3306}
      - WORDPRESS_ADMIN_PASSWORD_FILE=/run/secrets/wordpress_admin_password
      - WORDPRESS_USER_PASSWORD_FILE=/run/secrets/wordpress_user_password
      - MARIADB_USER_PASSWORD_FILE=/run/secrets/mariadb_user_password
    secrets:
      - mariadb_user_password
      - wordpress_admin_password
      - wordpress_user_password
    networks:
      - backend
      - frontend
# -----
  nginx:
    build:
      context: requirements/nginx/.
    depends_on:
      wordpress:
        condition: service_healthy
    restart: always
    volumes:
      - website:/home/website:ro
    environment:
      - WORDPRESS_DOMAIN=${WORDPRESS_DOMAIN:-vpoka.42.fr}
      - NGINX_PORT=${NGINX_PORT:-443}
      - WORDPRESS_FPM_PORT=${WORDPRESS_FPM_PORT:-9000}
    networks:
      - frontend
    ports:
      - ${NGINX_PORT:-443}:${NGINX_PORT:-443}
# ==============================================================================
volumes:
  database:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/viktor/inception-data/database
# -----
  website:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/viktor/inception-data/website
# ==============================================================================
secrets:
# -----
  mariadb_root_password:
    file: ./secrets/mariadb_root_password.txt
# -----
  mariadb_user_password:
    file: ./secrets/mariadb_user_password.txt
# -----
  wordpress_admin_password:
    file: ./secrets/wordpress_admin_password.txt
# -----
  wordpress_user_password:
    file: ./secrets/wordpress_user_password.txt
# ==============================================================================
# TODO: define an internal docker network
networks:
# -----
  backend:
    driver: bridge
# -----
  frontend:
    driver: bridge
    # internal: true # if uncommented, installation of wordpress files from internet fails, as this setting does not allow ANY connection to the outside
