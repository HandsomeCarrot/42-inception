name: Inception
# ==============================================================================
services:
  # nginx:
  #   build: requirements/nginx/.
  #   ports:
  #     - 80:80
  #   environment:
  #     - DOMAIN_NAME=${DOMAIN_NAME:-localhost}
# ------------------------------------------------------------------------------
  mariadb:
    build:
      context: ./requirements/mariadb
    restart: always
    volumes:
      - database:/home/data:rw
    environment:
      - WORDPRESS_DB_NAME=${WORDPRESS_DB_NAME:?}
      - WORDPRESS_DB_USER=${WORDPRESS_DB_USER:?}
      - DB_CHARSET=${DB_CHARSET:?}
      - DB_COLLATE=${DB_COLLATE:?}
      - MARIADB_ROOT_PASSWORD_FILE=/run/secrets/mariadb_root_password
      - MARIADB_USER_PASSWORD_FILE=/run/secrets/mariadb_user_password
    secrets:
      - mariadb_root_password
      - mariadb_user_password
    networks:
      - backend
# ------------------------------------------------------------------------------
  wordpress:
    build: ./requirements/wordpress
    depends_on:
      mariadb:
        condition: service_healthy
        # restart: true
    restart: always
    volumes:
      - website:/home/data:rw
    environment:
      - WORDPRESS_DB_NAME=${WORDPRESS_DB_NAME:?}
      - WORDPRESS_DB_USER=${WORDPRESS_DB_USER:?}
      - WORDPRESS_DB_TABLE_PREFIX=${WORDPRESS_DB_TABLE_PREFIX:?}
      - DB_CHARSET=${DB_CHARSET:?}
      - DB_COLLATE=${DB_COLLATE:?}
      - WORDPRESS_DOMAIN=${WORDPRESS_DOMAIN:?}
      - WORDPRESS_TITLE=${WORDPRESS_TITLE:?}
      - WORDPRESS_ADMIN_NAME=${WORDPRESS_ADMIN_NAME:?}
      - WORDPRESS_ADMIN_EMAIL=${WORDPRESS_ADMIN_EMAIL}
      - WORDPRESS_USER_NAME=${WORDPRESS_USER_NAME:?}
      - WORDPRESS_USER_EMAIL=${WORDPRESS_USER_EMAIL:?}
      - MARIADB_USER_PASSWORD_FILE=/run/secrets/mariadb_user_password
      - WORDPRESS_ADMIN_PASSWORD_FILE=/run/secrets/wordpress_admin_password
      - WORDPRESS_USER_PASSWORD_FILE=/run/secrets/wordpress_user_password
    secrets:
      - mariadb_user_password
      - wordpress_admin_password
      - wordpress_user_password
    networks:
      - backend
# ==============================================================================
volumes:
  database:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DB_DIR:?}
# ------------------------------------------------------------------------------
  website:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${WEB_DIR:?}
# ==============================================================================
secrets:
  mariadb_root_password:
    file: ./secrets/mariadb_root_password.txt
  mariadb_user_password:
    file: ./secrets/mariadb_user_password.txt
  wordpress_admin_password:
    file: ./secrets/wordpress_admin_password.txt
  wordpress_user_password:
    file: ./secrets/wordpress_user_password.txt
# ==============================================================================
# TODO: define an internal docker network
networks:
  backend:
    driver: bridge
    # internal: true # if uncommented, installation of wordpress files from internet fails, as this setting does not allow ANY connection to the outside
