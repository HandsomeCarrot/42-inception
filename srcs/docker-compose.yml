name: Inception

services:
  # nginx:
  #   build: requirements/nginx/.
  #   ports:
  #     - 80:80
  #   environment:
  #     - DOMAIN_NAME=${DOMAIN_NAME:-localhost}

  mariadb:
    build:
      context: ./requirements/mariadb
    restart: always
    volumes:
      - database:/home/data:rw
    environment:
      - DB_ROOT_PASSWORD=${MARIADB_ROOT_PASSWORD:?}
      - DB_NAME=${MARIADB_WORDPRESS_DATABASE_NAME:?}
      - DB_USER=${MARIADB_WORDPRESS_USER_NAME:?}
      - DB_PASSWORD=${MARIADB_WORDPRESS_USER_PASSWORD:?}

  wordpress:
    build: ./requirements/wordpress
    depends_on:
      mariadb:
        condition: service_healthy
        # restart: true
    restart: always
    volumes:
      - website:/home/data:rw
    environment:
      - DB_NAME=${MARIADB_WORDPRESS_DATABASE_NAME:?}
      - DB_USER=${MARIADB_WORDPRESS_USER_NAME:?}
      - DB_PASSWORD=${MARIADB_WORDPRESS_USER_PASSWORD:?}
      - DB_TABLE_PREFIX=${MARIADB_WORDPRESS_DATABASE_TABLE_PREFIX:?}
      - DB_CHARSET=${MARIADB_DATABASE_CHARSET:?}
      - DB_COLLATE=${MARIADB_DATABASE_COLLATE:?}
      - DOMAIN=${WORDPRESS_DOMAIN:?}
      - TITLE=${WORDPRESS_WEBSITE_TITLE:?}
      - WORDPRESS_ADMIN_NAME=${WORDPRESS_ADMIN_NAME:?}
      - WORDPRESS_ADMIN_PASSWORD=${WORDPRESS_ADMIN_PASSWORD:?}
      - WORDPRESS_ADMIN_EMAIL=${WORDPRESS_ADMIN_EMAIL}
      - WORDPRESS_USER_NAME=${WORDPRESS_USER_NAME:?}
      - WORDPRESS_USER_EMAIL=${WORDPRESS_USER_EMAIL:?}
      - WORDPRESS_USER_PASSWORD=${WORDPRESS_USER_PASSWORD:?}

volumes:
  database:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DB_DIR:?}

  website:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${WEB_DIR:?}

# TODO:
networks:
  default:
    # internal: true # if uncommented, installation of wordpress files from internet fails, as this setting does not allow ANY connection to the outside

